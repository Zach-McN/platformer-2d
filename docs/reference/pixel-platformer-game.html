<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Kernel — Pixel Platformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e8eaf6; --gold:#ffc93c; --line:#3a3f66; --panel:#20233a; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#6fb9ff; color:var(--ink);
    font-family:"Press Start 2P", monospace;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  /* ---------- viewport ---------- */
  #scroller{
    flex:1; overflow:hidden; background:#6fb9ff;
    display:flex; align-items:flex-end;
  }
  #game{image-rendering:pixelated; display:block; touch-action:none; cursor:default; flex-shrink:0;}
  /* ---------- HUD: coins, pinned top-right ---------- */
  #hud{
    position:fixed; top:12px; right:12px; z-index:20;
    display:flex; align-items:center; gap:8px;
    background:#00000066; border:3px solid var(--gold);
    box-shadow:0 4px 0 #00000055; padding:8px 12px; border-radius:3px;
    pointer-events:none;
  }
  #hudCoin{image-rendering:pixelated; width:24px; height:24px; display:block;}
  #hudCount{font-size:14px; color:var(--gold); text-shadow:2px 2px 0 #00000088; line-height:1;}
  /* ---------- controls hint (fades out) ---------- */
  #hint{
    position:fixed; left:12px; bottom:12px; z-index:20; pointer-events:none;
    background:#00000066; border:3px solid var(--line); padding:9px 12px;
    font-size:8px; line-height:1.9; color:var(--ink); border-radius:3px;
    transition:opacity .6s;
  }
  #hint b{color:var(--gold);}
  #hint.gone{opacity:0;}
  /* ---------- banner & touch ---------- */
  #banner{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    pointer-events:none; z-index:40;
  }
  #banner div{
    background:#000000cc; border:3px solid var(--gold); color:var(--gold);
    padding:22px 28px; font-size:14px; text-align:center; line-height:2;
  }
  #banner small{font-size:8px; color:var(--ink); display:block;}
  #touch{
    position:fixed; left:0; right:0; bottom:0; display:none; z-index:30;
    justify-content:space-between; padding:14px; pointer-events:none;
  }
  #touch .pad{display:flex; gap:10px; pointer-events:auto;}
  #touch button{
    width:64px; height:64px; font-family:inherit; font-size:18px;
    background:#20233acc; color:var(--ink); border:3px solid var(--line);
    border-radius:8px;
  }
  @media (max-width:640px){ #hint{display:none;} }
</style>
</head>
<body>

<div id="scroller"><canvas id="game"></canvas></div>

<div id="hud">
  <canvas id="hudCoin" width="16" height="16"></canvas>
  <span id="hudCount">0</span>
</div>

<div id="hint">
  <b>&larr;&rarr;</b> move &middot; <b>SPACE</b> jump &middot; <b>SHIFT</b> sprint<br>
  <b>R</b> restart &middot; <b>M</b> mute &middot; stomp enemies, bump blocks, reach the flag
</div>

<div id="banner"><div id="bannerText"></div></div>

<div id="touch">
  <div class="pad">
    <button id="tLeft">&#9664;</button>
    <button id="tRight">&#9654;</button>
  </div>
  <div class="pad">
    <button id="tRun">&#187;</button>
    <button id="tJump">&#9650;</button>
  </div>
</div>

function makeTile(draw){
  const c=document.createElement('canvas'); c.width=TS; c.height=TS;
  const g=c.getContext('2d'); draw(g); return c;
}

  const g=c.getContext('2d'); draw(g); return c;

function sliceSheet(img){
  let n=0;
  for(const name in SHEET_LAYOUT){
    const [sx,sy,sw,sh]=SHEET_LAYOUT[name];
    const c=document.createElement('canvas'); c.width=sw; c.height=sh;
    const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
    g.drawImage(img, sx,sy,sw,sh, 0,0,sw,sh);
    CACHE[name]=c; n++;
  }
  return n;
}
function loadSheet(){
  if(SHEET_SRC.indexOf('__SPRITE')>-1) return;      // no sheet embedded; keep procedural art
  const img=new Image();
  img.onload=()=>{
    try{
      const n=sliceSheet(img);
      console.log('spritesheet loaded: '+n+' sprites');
      draw();
    }catch(e){ console.warn('sheet slice failed, keeping procedural art', e); }
  };
  img.onerror=()=>console.warn('spritesheet failed to load, keeping procedural art');
  img.src=SHEET_SRC;
}

/* =========================================================
   TILE PROPERTIES — per-cell settings authored in the editor,
   keyed "x,y". Read-only here.
   ========================================================= */
const PROPS = {
  9:  {name:'ENEMY',  fields:[{key:'speed', def:0.55}]},
  16: {name:'TURTLE', fields:[{key:'speed', def:0.50}]},
};
const pKey=(x,y)=>x+','+y;
function propDefs(v){ return PROPS[v] || null; }
function getProp(x,y,key){
  const v=level.tiles[y][x], d=propDefs(v); if(!d) return undefined;
  const stored=level.props[pKey(x,y)];
  if(stored && stored[key]!==undefined) return stored[key];
  return d.fields.find(f=>f.key===key).def;
}

/* multi-tile props: drawn larger than their cell, anchored on the painted tile */
const BIG = {
  10: {w:3, h:2, ox:-1,   oy:-1},    // cloud — painted cell is bottom-centre
  14: {w:4, h:3, ox:-1.5, oy:-2},    // hill  — painted cell is base-centre
  12: {w:3, h:4, ox:-1,   oy:-3},    // tree  — painted cell is the trunk base
};

/* how much each decoration recedes into the background (1 = fully opaque) */
const FADE = {10:0.55, 14:0.45, 12:0.8};
/* draw order for decoration: 0 = furthest back, 1 = nearer. gameplay tiles are always last */
const DEPTH = {10:0, 14:0, 12:1, 11:1, 13:1, 15:1};

/* which sprite for a tile, given neighbors */
function spriteFor(x,y){
  const v = level.tiles[y][x];
  switch(v){
    case T.GROUND: return (y>0 && level.tiles[y-1][x]===T.GROUND) ? CACHE.ground_fill : CACHE.ground_top;
    case T.BRICK:  return CACHE.brick;
    case T.QUEST:  return CACHE.quest;
    case T.USED:   return CACHE.used;
    case T.COIN:   return CACHE.coin;
    case T.PIPE:   return (y>0 && level.tiles[y-1][x]===T.PIPE) ? CACHE.pipe_body : CACHE.pipe_top;
    case T.SPIKE:  return CACHE.spike;
    case T.FLAG:   return (y>0 && level.tiles[y-1][x]===T.FLAG) ? CACHE.flag_pole : CACHE.flag_top;
    case T.ENEMY:  return CACHE.enemy;
    case T.TURTLE: return CACHE.turtle;
    case T.CLOUD:  return CACHE.cloud;
    case T.BUSH:   return CACHE.bush;
    case T.TREE:   return CACHE.tree;
    case T.GRASS:  return CACHE.grass;
    case T.HILL:   return CACHE.hill;
    case T.FENCE:  return CACHE.fence;
  }
  return null;
}

/* ---------- canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const buf = document.createElement('canvas');
const bx = buf.getContext('2d');
const scroller = document.getElementById('scroller');
const ZOOM = 1.0;       // canvas fills the viewport height
const MIN_TILES_WIDE = 20;   // never zoom in so far that the level becomes a keyhole
function sizeCanvas(){
  const availH = scroller.clientHeight || 448;
  const availW = scroller.clientWidth  || 800;
  // fit the world's height to the viewport, but back off if that would leave
  // too few tiles visible across (tall, narrow phone screens)
  S = Math.min(availH/(level.height*TS), availW/(MIN_TILES_WIDE*TS)) * ZOOM;
  TSS = TS*S;
  canvas.width  = Math.round(level.width*TSS);
  canvas.height = Math.round(level.height*TSS);
  buf.width  = level.width*TS;          // logical resolution: 16px per tile
  buf.height = level.height*TS;
  bx.imageSmoothingEnabled = false;
  ctx.imageSmoothingEnabled = false;
}
sizeCanvas();
window.addEventListener('resize',()=>{
  sizeCanvas();
  camX = Math.max(0, Math.min(P.x*S - scroller.clientWidth/2 + P.w, canvas.width - scroller.clientWidth));
  scroller.scrollLeft = camX;
  draw();
});

/* =========================================================
   SOUND — all synthesized with Web Audio, zero asset files
   ========================================================= */
let AC=null, soundOn=true;
function audioCtx(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay=0){
  const a=audioCtx(), t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.03);
}
function sfx(name){
  if(!soundOn) return;
  try{
    switch(name){
      case 'jump':  tone(200,640,0.16,'square',0.10); break;
      case 'coin':  tone(988,988,0.07,'square',0.10);
                    tone(1319,1319,0.22,'square',0.10,0.07); break;
      case 'bump':  tone(130,60,0.09,'square',0.16); break;
      case 'break': tone(320,55,0.14,'sawtooth',0.14);
                    tone(700,120,0.08,'square',0.08); break;
      case 'stomp': tone(420,80,0.11,'square',0.15); break;
      case 'hurt':  tone(520,85,0.38,'sawtooth',0.12); break;
      case 'win':   [523,659,784,1047].forEach((f,i)=>tone(f,f,0.15,'square',0.10,i*0.12)); break;
    }
  }catch(e){ /* audio unavailable — fine */ }
}

function startGame(){
  if(soundOn) audioCtx();               // unlock audio if a gesture already happened

      const sp=getProp(x,y,'speed');
      playTiles[y][x]=0;
      enemies.push({kind:'turtle', state:'walk', x:x*TS+2, y:y*TS, vx:-sp, vy:0,
                    w:12, h:15, alive:true, squash:0, step:0, grace:0});
    }
  }
  popCoins=[]; particles=[];
  coins=0; setCoins(0);
  respawn();
  P.won=false;
  banner.style.display='none';
  if(matchMedia('(pointer:coarse)').matches) touchUI.style.display='flex';
  camX = Math.max(0, P.x*S - scroller.clientWidth/2 + P.w);
  scroller.scrollLeft = camX;
  if(!running){ running=true; requestAnimationFrame(loop); }
}

function respawn(){
  P.x=level.spawn.x*TS+2; P.y=level.spawn.y*TS+(TS-P.h);
  P.vx=0; P.vy=0; P.dead=0; P.grounded=false; P.coyote=0; P.run=0; P.land=0;
}
function solidAt(tx,ty){
  if(tx<0||tx>=level.width) return true;          // walls at level edges
  if(ty<0||ty>=level.height) return false;
  return SOLID.has(playTiles[ty][tx]);
}
function tileAt(tx,ty){
  if(tx<0||ty<0||tx>=level.width||ty>=level.height) return 0;
  return playTiles[ty][tx];
}

function physics(){
  if(P.won){ return; }
  if(P.dead>0){ P.dead--; if(P.dead===0) respawn(); return; }

  const left = keys.ArrowLeft||keys.a, right = keys.ArrowRight||keys.d;
  const jump = keys[' ']||keys.ArrowUp||keys.w;
  const sprinting = keys.Shift && (left||right);

  // accelerate toward the target speed instead of snapping to it
  const top = sprinting ? SPRINT : MOVE;
  const target = (right?top:0) - (left?top:0);
  if(target!==0){
    if(Math.abs(target-P.vx) <= ACC) P.vx = target;
    else P.vx += Math.sign(target-P.vx)*ACC;
  }else{
    if(Math.abs(P.vx) <= FRIC) P.vx = 0;
    else P.vx -= Math.sign(P.vx)*FRIC;
  }
  if(P.vx) P.face = Math.sign(P.vx);
  P.run = Math.abs(P.vx)>0.2 ? P.run + Math.abs(P.vx) : 0;   // drives the stride

  if(jump && (P.grounded||P.coyote>0) && !P.jumpHeld){
    P.vy = Math.abs(P.vx) > MOVE + 0.2 ? SPRINT_JUMP : JUMP;   // running jumps carry further
    P.grounded=false; P.coyote=0; P.jumpHeld=true; sfx('jump');
  }
  if(!jump){ P.jumpHeld=false; if(P.vy<-2.4) P.vy=-2.4; } // variable jump height
  P.vy=Math.min(P.vy+GRAV, MAXFALL);

  // --- horizontal ---
  P.x+=P.vx;
  {
    const y0=Math.floor(P.y/TS), y1=Math.floor((P.y+P.h-1)/TS);
    if(P.vx>0){
      const tx=Math.floor((P.x+P.w)/TS);
      for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ P.x=tx*TS-P.w-0.01; break; }
    }else if(P.vx<0){
      const tx=Math.floor(P.x/TS);
      for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ P.x=(tx+1)*TS+0.01; break; }
    }
  }
  // --- vertical ---
  P.y+=P.vy;
  const wasGrounded=P.grounded; P.grounded=false;
  {
    const x0=Math.floor((P.x+1)/TS), x1=Math.floor((P.x+P.w-1)/TS);
    if(P.vy>0){
      const ty=Math.floor((P.y+P.h)/TS);
      for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){
        if(P.vy>2.6) P.land=9;                 // hard landing -> squash
        P.y=ty*TS-P.h-0.01; P.vy=0; P.grounded=true; break;
      }
    }else if(P.vy<0){
      const ty=Math.floor(P.y/TS);
      for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){
        P.y=(ty+1)*TS+0.01; P.vy=0;
        bumpBlock(tx,ty);                       // head bonk
        break;
      }
    }
  }
  if(P.land>0) P.land--;
  P.coyote = P.grounded?6 : (wasGrounded?6:Math.max(0,P.coyote-1));

  // --- tile interactions on overlap ---
  const cx=P.x+P.w/2, cy=P.y+P.h/2;
  const x0=Math.floor(P.x/TS), x1=Math.floor((P.x+P.w)/TS);
  const y0=Math.floor(P.y/TS), y1=Math.floor((P.y+P.h)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const v=tileAt(tx,ty);
    if(v===T.COIN){
      // generous center check
      if(Math.abs(cx-(tx*TS+8))<10 && Math.abs(cy-(ty*TS+8))<10){
        playTiles[ty][tx]=0; addCoin(); sfx('coin');
        emitCoinSparkle(tx,ty);
      }
    }else if(v===T.SPIKE){
      if(P.y+P.h > ty*TS+6 && P.y < (ty+1)*TS && P.x+P.w > tx*TS+2 && P.x < (tx+1)*TS-2) die();
    }else if(v===T.FLAG && !P.won){
      win();
    }
  }
  if(P.y>level.height*TS+40) die(true);
}
/* ---------- particles ---------- */
let particles=[];
function emitBrickShards(tx,ty){
  // four chunky shards flying out of the block, tinted like the brick
  const cx=tx*TS+8, cy=ty*TS+8;
  const cols=['#e77a4f','#c1502e','#7d2a12','#c1502e'];
  const dirs=[[-1.5,-3.2],[1.5,-3.2],[-1.1,-1.9],[1.1,-1.9]];
  for(let i=0;i<4;i++){
    particles.push({x:cx-2, y:cy-2, vx:dirs[i][0], vy:dirs[i][1],
      g:0.26, size:4, col:cols[i], life:34, max:34, spin:true});
  }
  // a little dust puff
  for(let i=0;i<5;i++){
    particles.push({x:cx-1, y:cy-1, vx:(Math.random()-0.5)*2.4, vy:-Math.random()*1.6,
      g:0.06, size:2, col:'#d8b39c', life:16, max:16});
  }
}
function emitCoinSparkle(tx,ty){
  const cx=tx*TS+8, cy=ty*TS+8;
  for(let i=0;i<7;i++){
    const a=(Math.PI*2*i)/7 + Math.random()*0.4;
    particles.push({x:cx-1, y:cy-1, vx:Math.cos(a)*1.5, vy:Math.sin(a)*1.5-0.6,
      g:0.03, size:2, col: i%2 ? '#fff8c9' : '#f6c521', life:20, max:20});
  }
}
function emitPuff(x,y,col){
  for(let i=0;i<6;i++){
    particles.push({x, y, vx:(Math.random()-0.5)*2.2, vy:-Math.random()*2-0.4,
      g:0.12, size:3, col, life:22, max:22});
  }
}
function updateParticles(){
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.98; p.life--;
  }
  particles=particles.filter(p=>p.life>0);
}

let popCoins=[];   // coins flying out of ? blocks
function bumpBlock(tx,ty){
  const v=tileAt(tx,ty);
  if(v===T.QUEST){
    playTiles[ty][tx]=T.USED; addCoin(); sfx('coin');
    // the coin itself: pops out the top of the block, spins, falls back in
    popCoins.push({x:tx*TS, y:ty*TS-2, vy:-3.4, life:34, spin:0});
  }
  else if(v===T.BRICK){
    playTiles[ty][tx]=0; sfx('break');
    emitBrickShards(tx,ty);
    killEnemiesOnTile(tx,ty);
  }
  else sfx('bump');
}
function killEnemiesOnTile(tx,ty){
  // anything standing on top of this tile gets knocked off its feet
  const left=tx*TS, right=(tx+1)*TS, top=ty*TS;
  for(const e of enemies){
    if(!e.alive) continue;
    const ecx=e.x+e.w/2, efeet=e.y+e.h;
    if(ecx>left-3 && ecx<right+3 && efeet>top-6 && efeet<top+8){
      knockOut(e, ecx<left+8 ? -1 : 1);
      sfx('stomp');
    }
  }
}
function updatePopCoins(){
  for(const c of popCoins){
    c.y+=c.vy; c.vy+=0.26; c.spin+=0.9; c.life--;
    if(c.life===1) emitCoinSparkle(Math.round(c.x/TS), Math.round(c.y/TS));
  }
  popCoins=popCoins.filter(c=>c.life>0);
}
function toShell(e){
  e.state='shell'; e.vx=0; e.grace=14;
  e.h=12; e.w=14; e.x-=1; e.y+=3;      // shell is squatter than the walking turtle
}
function kickShell(e,dir){
  e.state='slide'; e.vx=dir*3.4; e.grace=8;
  sfx('stomp'); emitPuff(e.x+e.w/2-1, e.y+e.h-4, '#8be3a0');
}
function knockOut(e,dir){
  e.alive=false; e.squash=48; e.flip=true;
  e.vy=-4.2; e.vx=dir*1.1;
  emitPuff(e.x+e.w/2-1, e.y+e.h-4, e.kind==='turtle'?'#2e9e4f':'#a0522d');
}
function updateEnemies(){
  for(const e of enemies){
    if(!e.alive){
      if(e.flip){ e.x+=e.vx; e.y+=e.vy; e.vy+=GRAV*0.8; }   // tumble off screen
      e.squash--; continue;
    }
    e.step++;
    if(e.grace>0) e.grace--;
    e.vy=Math.min(e.vy+GRAV, MAXFALL);
    // horizontal move + wall turn (a sliding shell bounces off walls the same way)
    e.x+=e.vx;
    {
      const y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-1)/TS);
      if(e.vx>0){
        const tx=Math.floor((e.x+e.w)/TS);
        for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ e.x=tx*TS-e.w-0.01; e.vx*=-1; if(e.state==='slide') sfx('bump'); break; }
      }else if(e.vx<0){
        const tx=Math.floor(e.x/TS);
        for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ e.x=(tx+1)*TS+0.01; e.vx*=-1; if(e.state==='slide') sfx('bump'); break; }
      }
    }
    // vertical move
    e.y+=e.vy; let grounded=false;
    {
      const x0=Math.floor((e.x+1)/TS), x1=Math.floor((e.x+e.w-1)/TS);
      if(e.vy>0){
        const ty=Math.floor((e.y+e.h)/TS);
        for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){ e.y=ty*TS-e.h-0.01; e.vy=0; grounded=true; break; }
      }else if(e.vy<0){
        const ty=Math.floor(e.y/TS);
        for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){ e.y=(ty+1)*TS+0.01; e.vy=0; break; }
      }
    }
    // ledge turn: walkers respect edges, a kicked shell does not
    if(grounded && e.state==='walk'){
      const aheadX = e.vx>0 ? Math.floor((e.x+e.w+1)/TS) : Math.floor((e.x-1)/TS);
      const belowY = Math.floor((e.y+e.h+2)/TS);
      if(!solidAt(aheadX,belowY)) e.vx*=-1;
    }
    if(e.y>level.height*TS+40){ e.alive=false; e.squash=0; continue; }

    // a sliding shell mows down anything else it touches
    if(e.state==='slide'){
      for(const o of enemies){
        if(o===e || !o.alive) continue;
        if(e.x<o.x+o.w && e.x+e.w>o.x && e.y<o.y+o.h && e.y+e.h>o.y){
          knockOut(o, Math.sign(e.vx)||1); sfx('stomp');
        }
      }
    }

    // player contact
    if(P.dead===0 && !P.won && e.grace===0 &&
       P.x<e.x+e.w && P.x+P.w>e.x && P.y<e.y+e.h && P.y+P.h>e.y){
      const stomped = P.vy>0.5 && (P.y+P.h)-e.y < 10;
      const dir = (P.x+P.w/2) < (e.x+e.w/2) ? 1 : -1;   // kick away from the player
      if(e.kind==='turtle'){
        if(e.state==='walk'){
          if(stomped){ toShell(e); P.vy=-4.4; sfx('stomp');
                       emitPuff(e.x+e.w/2-1, e.y+e.h-4, '#8be3a0'); }
          else die();
        }else if(e.state==='shell'){
          kickShell(e, dir);                    // stomp or bump both kick it
          if(stomped) P.vy=-4.4;
        }else{                                  // sliding
          if(stomped){ e.state='shell'; e.vx=0; e.grace=12; P.vy=-4.4; sfx('stomp'); }
          else die();
        }
      }else{
        if(stomped){
          e.alive=false; e.squash=22; P.vy=-4.4; sfx('stomp');
          emitPuff(e.x+e.w/2-1, e.y+e.h-5, '#c9b39a');
        }else die();
      }
    }
  }
  enemies=enemies.filter(e=>e.alive||e.squash>0);
}
function die(fell){
  if(P.dead>0||P.won) return;
  P.dead=40; P.vy=fell?0:-4; sfx('hurt');
  bannerText.innerHTML='OUCH!<small>respawning...</small>';
  banner.style.display='flex';
  setTimeout(()=>{ if(!P.won) banner.style.display='none'; },700);
}
function win(){
  P.won=true; P.vx=0; sfx('win');
  bannerText.innerHTML='LEVEL CLEAR!<small>coins: '+coins+' &middot; press R to play again</small>';
  banner.style.display='flex';
}

window.addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  keys[e.key.length===1?e.key.toLowerCase():e.key]=true;
});
window.addEventListener('keyup',e=>{ keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });
function bindTouch(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault(); keys[key]=true;});
  el.addEventListener('pointerup',()=>keys[key]=false);
  el.addEventListener('pointercancel',()=>keys[key]=false);
  el.addEventListener('pointerleave',()=>keys[key]=false);
}
bindTouch('tLeft','ArrowLeft'); bindTouch('tRight','ArrowRight');
bindTouch('tJump',' '); bindTouch('tRun','Shift');

/* restart, mute */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){ startGame(); }
  if(k==='m'){ soundOn=!soundOn; if(soundOn) sfx('coin'); }
});

/* the controls hint gets out of the way once you start moving */
let hintTimer=setTimeout(fadeHint, 9000);
function fadeHint(){
  const h=document.getElementById('hint');
  if(h) h.classList.add('gone');
  clearTimeout(hintTimer);
}
window.addEventListener('keydown',fadeHint,{once:true});
window.addEventListener('pointerdown',fadeHint,{once:true});

function drawBackdrop(){
  const w=buf.width,h=buf.height;
  const grd=bx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#6fb9ff'); grd.addColorStop(1,'#b8e6ff');
  bx.fillStyle=grd; bx.fillRect(0,0,w,h);
}
function drawTiles(tiles){
  const save=level.tiles; level.tiles=tiles; // spriteFor reads level.tiles
  // pass 0 = far decoration (hills, clouds), 1 = near decoration, 2 = gameplay tiles
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<level.height;y++)for(let x=0;x<level.width;x++){
      const v=tiles[y][x]; if(!v) continue;
      const layer = BG.has(v) ? DEPTH[v] : 2;
      if(layer!==pass) continue;
      const sp=spriteFor(x,y); if(!sp) continue;
      const b=BIG[v], f=FADE[v];
      if(f) bx.globalAlpha=f;
      if(b) bx.drawImage(sp,(x+b.ox)*TS,(y+b.oy)*TS,b.w*TS,b.h*TS);
      else  bx.drawImage(sp,x*TS,y*TS,TS,TS);
      if(f) bx.globalAlpha=1;
    }
  }
  level.tiles=save;
}
/* Moving things are drawn straight to the display canvas at true sub-pixel
   positions (worldX * S, never rounded). Rounding is what causes jitter:
   a constant velocity lands between pixels, and snapping to a grid turns
   even motion into uneven steps. Sprites stay crisp because smoothing is
   off, so only the sampling grid shifts, not the art. */
function drawPlayer(){
  if(P.dead>0 && (P.dead%6<3)) return; // blink
  // pick the frame
  let sp;
  if(!P.grounded)               sp = P.vy < 0 ? CACHE.nj_jump : CACHE.nj_fall;
  else if(Math.abs(P.vx)>0.2)   sp = [CACHE.nj_walk0,CACHE.nj_walk1,CACHE.nj_walk2,CACHE.nj_walk3][Math.floor(P.run/3.2)%4];
  else                          sp = CACHE.nj_idle;

  // squash and stretch: stretch through fast vertical motion, squash on impact
  let sx=1, sy=1;
  if(P.land>0){
    const t=P.land/9;                       // eases back out over the timer
    sy = 1 - 0.30*t; sx = 1 + 0.26*t;
  }else if(!P.grounded){
    const v = Math.min(1, Math.abs(P.vy)/6);
    sy = 1 + 0.18*v; sx = 1 - 0.13*v;
  }else if(Math.abs(P.vx) > MOVE + 0.2){
    sx = 1.06; sy = 0.97;                   // slight forward lean at sprint
  }

  const w=12*S, h=16*S;
  const dw=w*sx, dh=h*sy;
  const cx=P.x*S + w/2;                     // anchor: bottom centre, so feet stay planted
  const feet=P.y*S + h;
  const dx=cx-dw/2, dy=feet-dh;

  if(P.face<0){
    ctx.save();
    ctx.translate(dx+dw/2, 0); ctx.scale(-1,1);
    ctx.drawImage(sp, -dw/2, dy, dw, dh);
    ctx.restore();
  }else{
    ctx.drawImage(sp, dx, dy, dw, dh);
  }
}
function drawPopCoins(){
  for(const c of popCoins){
    const sq=Math.abs(Math.cos(c.spin));
    const w=Math.max(2, TSS*sq), x=c.x*S+(TSS-w)/2, y=c.y*S;
    ctx.globalAlpha = c.life<10 ? c.life/10 : 1;
    ctx.drawImage(CACHE.coin, x, y, w, TSS);
    if(c.life<14){
      ctx.fillStyle='#fff8c9';
      const s=(14-c.life)*1.2;
      ctx.fillRect(c.x*S+TSS/2-1, y+TSS/2-s, 2, s*2);
      ctx.fillRect(c.x*S+TSS/2-s, y+TSS/2-1, s*2, 2);
    }
    ctx.globalAlpha=1;
  }
}
function drawEnemies(){
  for(const e of enemies){
    const x=(e.x-2)*S, y=(e.y-2)*S;
    const base = e.kind==='turtle'
      ? (e.state==='walk' ? CACHE.turtle : CACHE.shell)
      : CACHE.enemy;
    if(!e.alive){
      if(e.flip){
        ctx.save(); ctx.translate(x+TSS/2, y+TSS/2); ctx.scale(1,-1);
        ctx.drawImage(base,-TSS/2,-TSS/2,TSS,TSS); ctx.restore();
      }else{
        ctx.drawImage(CACHE.enemy_squash,x,y,TSS,TSS);
      }
      continue;
    }
    if(e.state==='slide'){
      const sq=Math.abs(Math.cos(e.step*0.45));
      const w=Math.max(TSS*0.45, TSS*sq);
      ctx.drawImage(base, x+(TSS-w)/2, y, w, TSS);
      continue;
    }
    if(e.state==='shell'){ ctx.drawImage(base,x,y,TSS,TSS); continue; }
    const bob=(Math.floor(e.step/8)%2)?S:0;
    ctx.drawImage(base,x,y+bob,TSS,TSS-bob);
  }
}
function drawParticlesBuf(){
  for(const p of particles){
    const t=p.life/p.max;
    ctx.globalAlpha = t<0.4 ? t/0.4 : 1;
    let sz=p.size*S;
    if(p.spin) sz=Math.max(S, p.size*S*(0.6+0.4*Math.abs(Math.cos(p.life*0.35))));
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x*S, p.y*S, sz, sz);
    ctx.globalAlpha=1;
  }
}

function draw(){
  // static world: rendered once at logical resolution, blitted with one uniform scale
  drawBackdrop();
  drawTiles(playTiles || level.tiles);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(buf,0,0,buf.width,buf.height,0,0,canvas.width,canvas.height);
  // moving things: drawn on top at sub-pixel precision
  drawEnemies(); drawPlayer(); drawPopCoins(); drawParticlesBuf();
}

/* ---------- main loop ---------- */
function loop(){
  physics();
  updateEnemies();
  updatePopCoins();
  updateParticles();
  draw();
  // camera follow — tracked as a float; scrollLeft snaps to whole pixels, so
  // reading it back each frame would feed that quantization into the easing
  const maxX = Math.max(0, canvas.width - scroller.clientWidth);
  const target = Math.max(0, Math.min(P.x*S - scroller.clientWidth/2 + P.w, maxX));
  camX += (target-camX)*0.15;
  scroller.scrollLeft = camX;
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
loadSheet();
paintHudCoin();
startGame();
</script>
</body>
